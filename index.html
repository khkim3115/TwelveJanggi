<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="십이장기 — 3×4 판 위의 王·將·相·子. 난이도별 AI 와 혼자 두거나, 방 코드로 친구와 온라인 1:1 로 두는 웹 십이장기."
    />
    <title>십이장기</title>
    <script>
      // 저장된 테마를 첫 페인트 전에 적용한다 — 번들이 뜰 때까지 다크로 깜빡이지 않게(gameStore.applyTheme 와 같은 키).
      try {
        var t = localStorage.getItem('tj_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          if (t === 'light') document.querySelector('meta[name=theme-color]').setAttribute('content', '#f5f6f8');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
