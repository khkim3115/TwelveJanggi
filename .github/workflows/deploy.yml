name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 권한: Pages 배포에 필요한 만큼만
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나. 진행 중인 배포는 끝까지 두고, 그 사이 쌓인 실행만 건너뛴다(GitHub 권장).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Supabase 값은 공개용(anon)이라 repo Variables 로 주입한다(Settings → Secrets and variables → Actions → Variables).
      # 비어 있으면 온라인 대전이 조용히 꺼진 채 배포되므로 여기서 멈춘다.
      - name: Supabase Variables 확인
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::repo Variables VITE_SUPABASE_URL · VITE_SUPABASE_ANON_KEY 가 비어 있습니다 — 온라인 대전이 꺼진 채 배포되지 않게 멈춥니다."
            exit 1
          fi
      - uses: actions/checkout@v7
      # 빌드 Node 는 현재 LTS(24). Node 20 은 2026-04-30 에 지원이 끝났다.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
