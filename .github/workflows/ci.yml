name: CI

# PR(대상 main)마다 타입체크 · 테스트 · 빌드. 배포는 main push 때 deploy.yml 이 따로 한다.
on:
  pull_request:
    branches: [main]

# GITHUB_TOKEN 권한: 코드를 읽기만 한다
permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 앞선 검사는 취소한다(마지막 커밋의 결과만 머지 버튼에 쓰인다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 검사 이름 = 잡 id(check). 저장소 설정에서 필수 검사로 지정할 때 이 이름을 쓴다 — 바꾸면 설정도 함께 고친다.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # deploy.yml 과 같은 Node 24(현재 LTS)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 강도 회귀(strength.test.ts)는 시간이 아니라 노드 예산으로 돌아 러너 속도와 무관하게 같은 결과가 나온다.
      - run: npm test
      # Supabase Variables 없이 빌드한다(온라인 대전이 꺼진 번들). 배포용 값 확인은 deploy.yml 몫이다.
      - run: npm run build
