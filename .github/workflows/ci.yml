name: CI

# PR(대상 main)마다 타입체크 · 테스트 · SQL 규칙 대조 · 빌드 · build:tray · typecheck:desktop · Windows 트레이 스모크. 배포는 main push 때 deploy.yml 이 따로 한다.
on:
  pull_request:
    branches: [main]

# GITHUB_TOKEN 권한: 코드를 읽기만 한다
permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 앞선 검사는 취소한다(마지막 커밋의 결과만 머지 버튼에 쓰인다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 검사 이름 = 잡 id(check). main 브랜치 보호의 필수 검사라 이름을 바꾸면 보호 설정도 함께 고친다.
  # 경로 필터(paths-ignore)를 걸지 않는 것도 같은 이유 — 검사가 안 도는 PR 은 머지가 막힌다.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # deploy.yml 과 같은 Node 24(현재 LTS)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 강도 회귀(strength.test.ts)는 시간이 아니라 노드 예산으로 돌아 러너 속도와 무관하게 같은 결과가 나온다.
      - run: npm test
      # 서버(plpgsql)·클라이언트 규칙 일치 — 로컬 Postgres(PGlite) 빠른 모드(4판 · 표본 5%). 깊은 모드(--deep)는 로컬에서.
      - run: npm run test:sql
      # Supabase Variables 없이 빌드한다(온라인 대전이 꺼진 번들). 배포용 값 확인은 deploy.yml 몫이다.
      - run: npm run build
      # 트레이 앱 화면 빌드(dist-tray) — 웹 전용 모듈이 들어오면 빌드가 실패한다(#20).
      - run: npm run build:tray
      # 데스크톱 JS 타입 검사 — Electron 42+ 는 설치 때 바이너리를 받지 않아 몇 초다. 루트 단계보다 뒤에 둔다(루트가 desktop 설치 없이 도는지 확인).
      - run: npm --prefix desktop ci
      - run: npm run typecheck:desktop

  # 트레이 앱 스모크 — 실제 Electron 으로 app:// · CSP · AI 워커 · 보안 기본선을 확인한다(#20). 필수 검사 여부는 브랜치 보호 설정이 정한다.
  tray-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      electron_config_cache: ${{ github.workspace }}\.electron-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      # Windows 에서도 데스크톱 순수 모듈 시험(정션 · 한글/공백 루트)을 돈다.
      - run: npx vitest run desktop/lib scripts
      - uses: actions/cache@v6
        with:
          path: .electron-cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - run: node desktop/node_modules/electron/install.js
      # 가짜 .invalid 값 — 설정된 CSP 분기(https · wss)를 브라우저로 확인한다. 실제 요청은 스모크의 noNetwork 가드가 막는다.
      - run: npm run build:tray
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
      - run: npm --prefix desktop run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tray-smoke
          path: desktop/smoke-out/
          if-no-files-found: warn
